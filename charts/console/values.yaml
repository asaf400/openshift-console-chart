# Default values for openshift-console.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: quay.io/openshift/origin-console
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

secrets:
  idpSecret:
    secretName: idp-secret
    create: true
    clientSecret:
  oidcCookiesEncryption:
    secretName: oidc-cookies-encryption
    create: true
    # base64 encoded string
    # authnKey:
    # encryptKey:
oidcIdentityProvider: ""

# only modify the string elements, not the claim keys
claims:
  preferredUsername:
    - preferred_username
  name:
    - name
  email:
    - email
  groups:
    - groups

bridgeEnvironmentVariables:
  BRIDGE_USER_AUTH: oidc
  BRIDGE_K8S_AUTH: oidc
  # BRIDGE_BASE_ADDRESS: "https://my-console.cluster.example.com"
  # BRIDGE_USER_AUTH_OIDC_CLIENT_ID: BRIDGE_USER_AUTH_OIDC_CLIENT_ID
  # BRIDGE_USER_AUTH_OIDC_ISSUER_URL: https://my-oidc-prodiver.okta.jumpcloud.example.com
  # BRIDGE_USER_AUTH_OIDC_CLIENT_SECRET defaults to consuming vaule from values.secrets.idpSecret.secretName

extraEnv: ""
#   - name: BRIDGE_INACTIVITY_TIMEOUT
#    value: 300
#    # Disable console telemetry (use STATE=DISABLED per console-shared useTelemetry / CLUSTER_TELEMETRY_ANALYTICS).
#   - name: BRIDGE_TELEMETRY
#     value: "STATE=DISABLED"

# log-level
verbosity: 1

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  sslRedirect: true # Used for AWS ALB Controller
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Enable Plugins - run as a sidecar
# Since version 4.17 network tab has been extracted from console repo into a console dynamic plugin
plugins: []
  # - name: networking-console-plugin
  #   image: asaf400/openshift:networking-console-plugin-e8a088c
  #   port: 8080
  # - name: monitoring-plugin
  #   image: asaf400/openshift:monitoring-plugin
  #   port: 8081

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
